<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>File Upload</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 560px;
            margin: 48px auto;
            padding: 24px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        .field {
            margin: 16px 0;
        }

        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #0d6efd;
            color: #fff;
            cursor: pointer;
        }

            button:hover {
                background: #0b5ed7;
            }

        ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .hint {
            color: #666;
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Upload Files</h1>
        <p class="hint">Choose one or more files and click Upload.</p>

        <form id="uploadForm" method="post" enctype="multipart/form-data">
            <div class="field">
                <input id="fileInput" name="files" type="file" multiple />
            </div>

            <button id="uploadButton" type="submit">Upload</button>
        </form>

        <p id="status" class="hint"></p>

        <div class="field">
            <strong>Selected files:</strong>
            <ul id="selectedFiles"></ul>
        </div>

        <div class="field">
            <strong>Files API response:</strong>
            <ul id="serverFiles"></ul>
        </div>
    </main>

    <script>const uploadForm = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const status = document.getElementById('status');
        const selectedFiles = document.getElementById('selectedFiles');
        const serverFiles = document.getElementById('serverFiles');

        fileInput.addEventListener('change', () => {
            selectedFiles.innerHTML = '';

            for (const file of fileInput.files) {
                const item = document.createElement('li');
                item.textContent = `${file.name} (${Math.round(file.size / 1024)} KB)`;
                selectedFiles.appendChild(item);
            }
        });

        uploadForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            if (!fileInput.files.length) {
                status.textContent = 'Select at least one file.';
                return;
            }

            uploadButton.disabled = true;
            status.textContent = 'Uploading...';

            try {
                const formData = new FormData();
                for (const file of fileInput.files) {
                    formData.append('files', file);
                }

                const token = await getAntiForgeryToken();
                const headers = token ? { 'RequestVerificationToken': token } : {};

                const uploadResponse = await fetch('/files/', {
                    method: 'POST',
                    body: formData,
                    headers
                });

                if (!uploadResponse.ok) {
                    throw new Error(`Upload failed (${uploadResponse.status})`);
                }

                status.textContent = 'Upload accepted.';
                await loadFilesFromApi();
            } catch (error) {
                status.textContent = error.message;
            } finally {
                uploadButton.disabled = false;
            }
        });

        async function getAntiForgeryToken() {
            try {
                const response = await fetch('/antiforgery/token');
                if (!response.ok) {
                    return null;
                }

                return await response.text();
            } catch {
                return null;
            }
        }

        async function loadFilesFromApi() {
            serverFiles.innerHTML = '';

            const response = await fetch('/files/');
            if (!response.ok) {
                const item = document.createElement('li');
                item.textContent = `Could not load files (${response.status}).`;
                serverFiles.appendChild(item);
                return;
            }

            const contentType = response.headers.get('content-type') || '';
            if (!contentType.includes('application/json')) {
                const item = document.createElement('li');
                item.textContent = 'Upload endpoint is connected.';
                serverFiles.appendChild(item);
                return;
            }

            const files = await response.json();
            if (!Array.isArray(files) || files.length === 0) {
                const item = document.createElement('li');
                item.textContent = 'No files returned by API.';
                serverFiles.appendChild(item);
                return;
            }

            for (const file of files) {
                const item = document.createElement('li');
                item.textContent = typeof file === 'string' ? file : JSON.stringify(file);
                serverFiles.appendChild(item);
            }
        }

        loadFilesFromApi();</script>
</body>
</html>
